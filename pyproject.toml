# Tooling configuration for Cargento's Python code (the dashboard skill
# server, its tests, and the repo validation/release scripts). There is no
# installable package here — this file only configures lint/type/coverage.

[tool.ruff]
target-version = "py311"
line-length = 100
# The visibility-2x2-template exports are session artifacts (also gitignored);
# listed here so ruff skips them even when invoked with gitignore disabled.
extend-exclude = [".venv", "venv", "visibility-2x2-template", "visibility-2x2-template-alt"]

[tool.ruff.lint]
# Strict-by-default: every rule family on, with a curated, documented
# ignore list rather than a permissive selection.
select = ["ALL"]
# The dashboard UI deliberately uses "–" as its empty-value placeholder.
allowed-confusables = ["–"]
ignore = [
  "D",       # pydocstyle: docstring-on-everything is churn for a single-module server
  "ANN",     # flake8-annotations: mypy --strict owns annotation enforcement
  "COM812",  # trailing-comma rule conflicts with the ruff formatter
  "ISC001",  # implicit-str-concat rule conflicts with the ruff formatter
  "PTH",     # server.py deliberately uses os.path (hot filesystem scans, stdlib style)
  "DTZ",     # naive local-time handling is by design (local session mtimes)
  "FBT",     # boolean positional flags (show_all, strict) are part of the existing API
  "TD",      # TODO-format enforcement — no tracked-issue convention in this repo
  "FIX",     # same as TD
  "PT",      # flake8-pytest-style: this repo is deliberately stdlib-unittest
  "T20",     # print is the output channel for CLI entry points (server, scripts)
  "EM",      # exception-message style (assign-before-raise) — churn, no clarity gain
  "TRY003",  # long messages in raise are fine for the validator's error reporting
  "PLR2004", # threshold/format literals (86400, 60, …) read better inline here
  "CPY001",  # no per-file copyright-header convention (LICENSE covers the repo)
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# The launcher is seven lines and needs no exemptions. The runtime modules below
# keep only the ones their reviewed shape actually requires; the defensive
# harness collectors are inherently branchy, and refactoring them to satisfy
# complexity limits would trade real robustness for score.
# main() branches once per CLI verb and once per serve mode, each with its own
# early return, which is the shape the three distinct serve paths require.
"cargento/skills/cargento/cargento_runtime/cli.py" = ["C901", "PLR0911"]
"cargento/skills/cargento/cargento_runtime/config.py" = ["C901", "PLR0913"]
# `_turn_signal` retains the server's reviewed branch shape after extraction.
"cargento/skills/cargento/cargento_runtime/records.py" = ["C901", "PLR0911", "PLR0912"]
# The Gemini, Copilot and Droid analyzers keep the server's reviewed branch
# shape: each arm is one defensively-read field of an untyped harness record.
"cargento/skills/cargento/cargento_runtime/transcripts.py" = ["C901", "PLR0912"]
# `scan_turns` and its reverse-scan helper keep the server's reviewed branch
# shape: incremental offsets, rotation recovery, and the Gemini dedup arm.
"cargento/skills/cargento/cargento_runtime/turns.py" = ["C901", "PLR0912"]
# The Claude title, tail analyzer and agent classifier keep the launcher's
# reviewed shape: one arm per record kind, and one cache decision per bound.
"cargento/skills/cargento/cargento_runtime/claude_data.py" = ["C901", "PLR0912"]
# The Spacedock frontmatter and boot-envelope parsers keep the launcher's
# reviewed shape: one arm per frontmatter spelling, and one bound per read.
"cargento/skills/cargento/cargento_runtime/spacedock.py" = ["C901", "PLR0912"]
# stop_instance keeps the launcher's reviewed shape: one early return per way a
# stop can end, and each carries a distinct message and exit code.
"cargento/skills/cargento/cargento_runtime/lifecycle.py" = ["PLR0911"]
# The Claude collector keeps the launcher's shape: one branch per way a session
# can be read as working or blocked, and the open-question status line reads
# more clearly inline than wrapped.
"cargento/skills/cargento/cargento_runtime/collectors/claude.py" = [
    "E501",
    "C901",
    "PLR0912",
    "PLR0915",
]
# handle_payload keeps the launcher's ordering: SessionEnd retirement, the
# generation guard, subagent suppression, the clear decision and three
# cooldowns, all inside one reviewed critical section.
"cargento/skills/cargento/cargento_runtime/notifications.py" = ["C901"]
# Pi's projection and incremental scanner keep the branch shape they had in
# the launcher: one arm per JSONL entry kind, and one early return per way a
# partial write can interrupt a scan.
"cargento/skills/cargento/cargento_runtime/collectors/pi.py" = ["C901", "PLR0911"]
# OpenCode's one pass over a session table keeps the launcher's shape: parent
# and child rows, archival, freshness, and the per-session message scan.
"cargento/skills/cargento/cargento_runtime/collectors/opencode.py" = [
  "C901",
  "PLR0912",
  "PLR0915",
]
# Cursor's meta reader keeps the launcher's shape: several store versions,
# several workspace key spellings, and a transient-failure path that must not
# be cached.
"cargento/skills/cargento/cargento_runtime/collectors/cursor.py" = ["C901", "PLR0912"]
# Goose reads one shared sessions table: parent and child rows, content
# filtering, per-session messages and the token scan, all in the launcher's
# reviewed shape.
"cargento/skills/cargento/cargento_runtime/collectors/goose.py" = [
  "C901",
  "PLR0912",
  "PLR0915",
]
# The Antigravity log scanner, protobuf reader and step activity keep the
# launcher's reviewed shape: several log formats, a cache fallback, and a
# wire-format walk with one arm per wire type.
"cargento/skills/cargento/cargento_runtime/collectors/gemini.py" = [
  "C901",
  "PLR0912",
  "PLR0915",
]
"scripts/validate_plugins.py" = ["C901", "PLR0912", "PLR0915"]
# Tests: assert usage, subprocess invocations of node, and long fixture lines.
"**/tests/*.py" = ["S101", "S603", "S108", "S311", "E501", "SLF001", "INP001"]

[tool.mypy]
# Python 3.11 is the supported runtime floor. COMPATIBILITY.md owns the list
# of every place it is declared; ruff's target-version above must stay in
# lockstep with this one.
python_version = "3.11"
strict = true
warn_unreachable = true
# Analysis platform pin, kept for now but no longer load-bearing: the last
# darwin-only branch goes through native_notifier(sys.platform), which mypy
# does not narrow, so `mypy --platform linux` passes clean without this.
# Deleting it or writing a true justification is an open decision tracked in
# docs/plans/native-notifications.md.
platform = "darwin"
mypy_path = ["cargento/skills/cargento", "scripts"]
explicit_package_bases = true
files = [
  "cargento/skills/cargento/cargento_runtime",
  "cargento/skills/cargento/notify_hook.py",
  "cargento/skills/cargento/server.py",
  "cargento/skills/cargento/tests",
  "scripts",
]

# PyYAML ships no type stubs and we add no runtime/type dependencies, so the
# untyped import is expected. Ignoring missing imports also silences the
# subclassing-Any error for the SafeLoader subclass in validate_plugins.py.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
disallow_subclassing_any = false

[tool.coverage.run]
branch = true
source = [
  "cargento/skills/cargento",
  "scripts",
]

[tool.coverage.report]
# Coverage is reported for the code under test only; the test modules
# themselves would inflate the number.
omit = ["*/tests/*"]
show_missing = false
precision = 1
# Branch-coverage floor. This number only ratchets UP — never lower it in a
# PR. Use the `coverage-exception` PR label for a deliberate, visible bypass.
#
# 73 was set when the measured figure was 74.0%; the cross-platform regression
# suite has since raised real coverage well above that, so the floor is stale
# and slack. Re-reading the number off an Ubuntu gate run and ratcheting this
# in a dedicated PR is tracked in docs/plans/native-notifications.md.
#
# Platform branches are written as pure functions (design decision D-4 in
# docs/design-cross-platform.md) so every branch is exercisable on any runner.
fail_under = 73
