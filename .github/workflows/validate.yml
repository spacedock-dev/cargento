name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `claude plugin validate --strict` and `agy plugin validate` are part of the
# documented pre-PR suite (see AGENTS.md) but run locally only — those CLIs
# are not available on stock runners. scripts/validate_plugins.py is the
# load-bearing contract gate here.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.2 — pinned to immutable SHA (this is the
      # required check; mutable major tags don't belong here).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-python@v6.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-validation.txt
      - name: Validate plugin contracts
        run: python3 scripts/validate_plugins.py
      - name: Run validator unit tests
        run: python3 -m unittest scripts/tests/test_validate_plugins.py
      - name: Run release bump-script unit tests
        run: python3 -m unittest scripts/tests/test_bump_version.py
      - name: Check version-field parity across all owned locations
        run: python3 scripts/bump_version.py --current
      - name: Run dashboard server tests
        run: python3 -m unittest cargento/skills/cargento/tests/test_server.py
