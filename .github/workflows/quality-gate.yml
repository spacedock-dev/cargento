name: Quality Gate

# Strict lint (ruff, all rules), formatting, mypy --strict, frontend source
# checks, and the full unittest suite under coverage with an enforced
# threshold. The final `quality-gate` job aggregates every result into the one
# status that branch protection requires.
#
# Adapted from DataRecce/recce-cloud-infra `server-unittest.yaml` (lint/type/
# test job shape) and `coverage-report.yaml` (sticky PR coverage comment, gate
# job, `coverage-exception` label escape hatch), simplified for a
# single-component repository: everything runs in one workflow, so no
# workflow_run indirection or artifact cross-downloads are needed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect what the gate can measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Decide whether the measurable jobs need to run
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # FAILS OPEN, deliberately. Anything this cannot compute runs the full
          # gate. A wrong "false" silently skips the only check that would have
          # caught a regression; a wrong "true" costs one runner. Those are not
          # symmetric, so every unknown resolves to true.
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1"; exit 0; }

          [ "$EVENT" = "pull_request" ] || emit true

          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
          [ -n "$BASE" ] || emit true

          FILES=$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null || true)
          [ -n "$FILES" ] || emit true

          # The deny list is DERIVED, not hand-written: any docs file a test
          # opens by literal path is code as far as this gate is concerned.
          # Hand-maintaining it is how the filter would go stale the first time
          # someone asserts against a new design doc.
          ASSERTED=$(grep -rhoE '"docs/[^"]+\.md"' cargento/skills/cargento/tests/*.py \
                     | tr -d '"' | sort -u || true)

          # `case` globs match `/`, unlike pathname expansion, so `docs/*.md`
          # already covers `docs/plans/x.md` at any depth — a second
          # `docs/*/*.md` alternative is dead and actionlint (SC2222) says so.
          #
          # Prose that no test reads and no linter parses. SKILL.md is NOT here:
          # tests/test_documentation.py asserts its store paths against
          # config.resolve_store_roots.
          is_prose() {
            case "$1" in
              README.md|HOW_TO_USE.md|AGENTS.md|CLAUDE.md|CONTRIBUTING.md) return 0 ;;
              COMPATIBILITY.md|SECURITY.md|CODE_OF_CONDUCT.md) return 0 ;;
              .github/PULL_REQUEST_TEMPLATE.md|.github/ISSUE_TEMPLATE/*) return 0 ;;
              # THIS file is code: it is the gate, and the only honest way to
              # know the gate still works is to run it. Every other workflow is
              # not — it cannot change what the five jobs below measure, and it
              # already has its own trigger and its own status. Adding a comment
              # to version-guard.yml used to re-run three OS matrices.
              .github/workflows/quality-gate.yml) return 1 ;;
              .github/workflows/*) return 0 ;;
              docs/*.md)
                while IFS= read -r asserted; do
                  [ -n "$asserted" ] || continue
                  [ "$1" = "$asserted" ] && return 1
                done <<< "$ASSERTED"
                return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            is_prose "$f" || emit true
          done <<< "$FILES"

          echo "Every changed path is prose the gate cannot measure."
          emit false

  lint:
    name: Lint (ruff + format + frontend sources)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Ruff lint (select = ALL)
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Frontend source checks (JS syntax, CSS structure, DOM ids)
        run: python3 scripts/lint_embedded.py

  typecheck:
    name: Type check (mypy --strict)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Mypy (strict)
        run: mypy

  runtime-floor:
    name: Runtime floor (Python 3.11)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: python -m pip install -r requirements-dev.txt -r requirements-validation.txt
      - name: Direct-launch smoke on the supported floor
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/cargento/skills/cargento/server.py" --help
          python "${GITHUB_WORKSPACE}/cargento/skills/cargento/server.py" --diagnose --json
      - name: Run full unittest suite under coverage
        run: |
          coverage erase
          coverage run -m unittest discover -s cargento/skills/cargento/tests -t .
          coverage run -a -m unittest \
            scripts.tests.test_validate_plugins \
            scripts.tests.test_bump_version \
            scripts.tests.test_lint_embedded \
            scripts.tests.test_bench_collect \
            scripts.tests.test_capture_hook \
            scripts.tests.test_derive_prompt_shapes
          coverage report

  test:
    name: Tests + coverage threshold
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky coverage comment (same-repo PRs only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install toolchain
        run: python3 -m pip install -r requirements-dev.txt -r requirements-validation.txt

      - name: Run full unittest suite under coverage
        run: |
          coverage erase
          coverage run -m unittest discover -s cargento/skills/cargento/tests -t .
          coverage run -a -m unittest \
            scripts.tests.test_validate_plugins \
            scripts.tests.test_bump_version \
            scripts.tests.test_lint_embedded \
            scripts.tests.test_bench_collect \
            scripts.tests.test_capture_hook \
            scripts.tests.test_derive_prompt_shapes
          coverage report

      # The threshold lives in pyproject.toml ([tool.coverage.report]
      # fail_under) so local runs enforce the same gate. A PR labeled
      # `coverage-exception` may merge below threshold — label use is
      # deliberately visible in the PR timeline.
      - name: Check coverage-exception label
        id: exception
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HAS=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json labels --jq '[.labels[].name] | map(select(. == "coverage-exception")) | length')
          echo "has_exception=${HAS:-0}" >> "$GITHUB_OUTPUT"
          if [ "${HAS:-0}" != "0" ]; then
            echo "::warning::coverage-exception label present — threshold will not block"
          fi

      - name: Coverage report and threshold
        run: |
          coverage json -o coverage.json
          {
            echo "## Coverage"
            echo '```'
            coverage report --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.exception.outputs.has_exception || '0' }}" != "0" ]; then
            echo "Threshold skipped (coverage-exception label)."
            coverage report --fail-under=0 > coverage-report.txt
          else
            coverage report > coverage-report.txt
          fi
          cat coverage-report.txt

      - name: Upload coverage artifact
        # actions/upload-artifact@v7 — pinned to immutable SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.json
          retention-days: 7

      - name: Build coverage comment body
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "<!-- coverage-marker -->"
            echo "### Coverage"
            echo ""
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "_Threshold: \`fail_under\` in pyproject.toml · label \`coverage-exception\` to bypass (visible in PR timeline)._"
          } > coverage-comment.md

      # Sticky comment: find-and-update rather than spam. Same-repo PRs only —
      # fork PRs get a read-only token, and the gate itself never depends on
      # the comment.
      - name: Find existing coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: find-comment
        continue-on-error: true
        # peter-evans/find-comment@v4 — pinned to immutable SHA.
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- coverage-marker -->"

      - name: Post coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        # peter-evans/create-or-update-comment@v5 — pinned to immutable SHA.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: coverage-comment.md
          edit-mode: replace

  # The same unittest suite on every supported platform. Deliberately separate
  # from `test` rather than a matrix over it: that job is Bash throughout (`\`
  # line continuations, `gh`, `[ ... ]`, `$GITHUB_OUTPUT`, brace groups), none
  # of which is valid in the default `pwsh` shell on windows-latest, and three
  # matrix children would race on the one sticky coverage comment and the one
  # coverage artifact. Coverage stays Ubuntu-only so the ratchet stays
  # meaningful; this job only answers "does it run there at all".
  platform-tests:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # actions/checkout@v7.0.1 — pinned to immutable SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0 — pinned to immutable SHA.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      # `python`, not `python3`: the latter is not a reliable spelling on
      # native Windows. Every step below is single-line and shell-agnostic.
      #
      # The dashboard server itself is stdlib-only, but the repository
      # validator that scripts/tests/test_validate_plugins.py imports needs
      # PyYAML. The lint/type tooling in requirements-dev.txt is not needed
      # here — this job only runs unittest.
      - name: Install validation requirements
        run: python -m pip install -r requirements-validation.txt
      - name: Show interpreter
        run: python -c "import sys, os; print(sys.version, os.name, sys.platform)"
      - name: Confirm sqlite3 is present on this runner
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Run dashboard test discovery
        run: python -m unittest discover -s cargento/skills/cargento/tests -t .
      - name: Run script unit tests
        run: >-
          python -m unittest scripts.tests.test_validate_plugins
          scripts.tests.test_bump_version scripts.tests.test_lint_embedded
          scripts.tests.test_bench_collect scripts.tests.test_capture_hook

  # The single required status check. Branch protection requires this job, so
  # every job above must succeed (a skip or failure anywhere fails the gate).
  quality-gate:
    name: quality-gate
    needs: [changes, lint, typecheck, runtime-floor, test, platform-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gate jobs succeeded
        env:
          CODE: ${{ needs.changes.outputs.code }}
          R_CHANGES: ${{ needs.changes.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_FLOOR: ${{ needs.runtime-floor.result }}
          R_TEST: ${{ needs.test.result }}
          R_PLATFORM: ${{ needs.platform-tests.result }}
        run: |
          set -euo pipefail
          echo "changes:        $R_CHANGES (code=$CODE)"
          echo "lint:           $R_LINT"
          echo "typecheck:      $R_TYPECHECK"
          echo "runtime-floor:  $R_FLOOR"
          echo "test:           $R_TEST"
          echo "platform-tests: $R_PLATFORM"

          # The detector itself is never allowed to skip or fail. If it did, we
          # do not know whether the five below were skipped on purpose or lost,
          # and "we do not know" must not read as green on a required check.
          if [ "$R_CHANGES" != "success" ]; then
            echo "::error::The change detector did not succeed; refusing to report a gate result."
            exit 1
          fi

          # `skipped` is a pass ONLY when the detector said there was nothing the
          # job could measure. Anything else skipped means a dependency failed
          # upstream and GitHub cascaded it, which is a failure, not a pass.
          for pair in "lint:$R_LINT" "typecheck:$R_TYPECHECK" "runtime-floor:$R_FLOOR" \
                      "test:$R_TEST" "platform-tests:$R_PLATFORM"; do
            job=${pair%%:*}
            res=${pair#*:}
            if [ "$res" = "success" ]; then
              continue
            fi
            if [ "$res" = "skipped" ] && [ "$CODE" = "false" ]; then
              continue
            fi
            echo "::error::$job did not succeed (result=$res, code=$CODE)."
            exit 1
          done

          if [ "$CODE" = "false" ]; then
            echo "Quality gate passed: prose-only change, no measurable job to run."
          else
            echo "Quality gate passed."
          fi
