name: Lint Workflows

# Runs actionlint on changes that touch .github/workflows/** to catch parse
# errors, expression-syntax problems, and other workflow misuse before merge.
# Adapted from DataRecce/recce-team.
#
# Security model:
#   - Read-only: `permissions: contents: read` only.
#   - actions/checkout pinned to an immutable SHA.
#   - actionlint binary is downloaded from a pinned release URL and verified
#     against a pinned SHA-256 before execution. Bumping actionlint requires a
#     deliberate edit to both the version and the checksum.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1 — pinned to immutable SHA. Verify with
        # `gh api /repos/actions/checkout/git/refs/tags/v7.0.1 -q '.object.sha'`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          EXPECTED_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"

          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -

          tar -xzf "$ARCHIVE" actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color
